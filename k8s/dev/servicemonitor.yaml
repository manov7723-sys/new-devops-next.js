apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: new-devops-next-js
  namespace: teem
  labels:
    app.kubernetes.io/name: new-devops-next-js
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: new-devops-next-js
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
