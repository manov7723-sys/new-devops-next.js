apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: new-devops-next-js-postgres-password
  namespace: then
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: teams-dev/then/POSTGRES_PASSWORD
